name: Credential-free tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      ALPACA_API_KEY: ''
      ALPACA_API_SECRET: ''
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-v4.txt
      - run: python -m pip install -r requirements.txt -c constraints-v4.txt
      - run: python -m unittest discover -s tests -v
      - run: python bot.py run --synthetic --mode offline
      - run: python -m trading.llm_research study --synthetic --output /tmp/trading-fixture.json
